name: Publish versioned image
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify release version and changelog
        run: node scripts/release-check.js
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: docker build --pull --build-arg APP_VERSION="$GITHUB_REF_NAME" -t recipebox:ci .
      - run: node scripts/container-smoke.js
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
      REGISTRY_NAMESPACE: ${{ vars.CONTAINER_NAMESPACE }}
    steps:
      - uses: actions/checkout@v6
      - name: Check registry configuration and secrets
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          test -n "$REGISTRY" || { echo 'Missing repository variable CONTAINER_REGISTRY'; exit 1; }
          test -n "$REGISTRY_USERNAME" || { echo 'Missing repository secret REGISTRY_USERNAME'; exit 1; }
          test -n "$REGISTRY_PASSWORD" || { echo 'Missing repository secret REGISTRY_PASSWORD'; exit 1; }
      - name: Derive image name from repository
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          if [ -n "$REGISTRY_NAMESPACE" ]; then repository="${REGISTRY_NAMESPACE,,}/${repository##*/}"; fi
          echo "name=${REGISTRY,,}/$repository" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        id: published_image
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          build-args: APP_VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      - name: Verify published image and GHCR visibility
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          EXPECTED_DIGEST: ${{ steps.published_image.outputs.digest }}
          GH_TOKEN: ${{ secrets.REGISTRY_PASSWORD }}
        shell: bash
        run: |
          image_ref="$IMAGE_NAME:$GITHUB_REF_NAME"
          published_digest=$(docker buildx imagetools inspect "$image_ref" --format '{{.Manifest.Digest}}')
          test "$published_digest" = "$EXPECTED_DIGEST" || { echo 'Published tag digest does not match build output'; exit 1; }
          docker pull "$IMAGE_NAME@$EXPECTED_DIGEST"
          echo "Verified image: $image_ref@$EXPECTED_DIGEST"
          if [ "${REGISTRY,,}" = ghcr.io ]; then
            image_path="${IMAGE_NAME#*/}"
            package_owner="${image_path%%/*}"
            package_name="${image_path#*/}"
            encoded_package=$(jq -rn --arg value "$package_name" '$value | @uri')
            owner_type=$(gh api "users/$package_owner" --jq '.type')
            package_route=users
            if [ "$owner_type" = Organization ]; then package_route=orgs; fi
            visibility=$(gh api "$package_route/$package_owner/packages/container/$encoded_package" --jq '.visibility')
            echo "Verified GHCR package visibility: $visibility"
            test "$visibility" = private || { echo 'Expected a private GHCR package; no visibility setting was changed'; exit 1; }
          fi
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Extract release notes
        run: node scripts/release-check.js --notes > release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
