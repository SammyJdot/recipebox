name: Publish versioned image
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify release version and changelog
        run: node scripts/release-check.js
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: docker build --pull --build-arg APP_VERSION="$GITHUB_REF_NAME" -t recipebox:ci .
      - run: node scripts/container-smoke.js
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
      REGISTRY_NAMESPACE: ${{ vars.CONTAINER_NAMESPACE }}
    steps:
      - uses: actions/checkout@v4
      - name: Check registry configuration and secrets
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          test -n "$REGISTRY" || { echo 'Missing repository variable CONTAINER_REGISTRY'; exit 1; }
          test -n "$REGISTRY_USERNAME" || { echo 'Missing repository secret REGISTRY_USERNAME'; exit 1; }
          test -n "$REGISTRY_PASSWORD" || { echo 'Missing repository secret REGISTRY_PASSWORD'; exit 1; }
      - name: Derive image name from repository
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          if [ -n "$REGISTRY_NAMESPACE" ]; then repository="${REGISTRY_NAMESPACE,,}/${repository##*/}"; fi
          echo "name=${REGISTRY,,}/$repository" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          build-args: APP_VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=AGPL-3.0-only
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Extract release notes
        run: node scripts/release-check.js --notes > release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
